# Generated by `sbomify-action wizard`. Re-run the wizard to update.
# sbomify-action wizard v1
name: sboms
on:
  push:
    branches: [main]
    paths:
      - 'uv.lock'
      - '.github/workflows/sboms.yml'
  workflow_dispatch:
jobs:
  sbom:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to mint the GitHub OIDC JWT
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lithium
            component_name: lithium
            component_id: yKQS5U6paR60
            lockfile: uv.lock
            sbom_format: cyclonedx
            output_file: lithium.cdx.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .sbomify-cache
          key: sbomify-${{ runner.os }}
      - id: ver
        run: echo "v=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: sbomify/sbomify-action@f503be3f404c36162f8713d92f17b847658dfb65  # master (OIDC runtime; unreleased)
        env:
          COMPONENT_ID: ${{ matrix.component_id }}
          COMPONENT_NAME: ${{ matrix.component_name }}
          COMPONENT_VERSION: ${{ steps.ver.outputs.v }}
          LOCK_FILE: ${{ matrix.lockfile }}
          UPLOAD: 'true'
          AUGMENT: 'false'
          ENRICH: 'true'
          SBOM_FORMAT: ${{ matrix.sbom_format }}
          OUTPUT_FILE: ${{ matrix.output_file }}
          API_BASE_URL: https://stage.sbomify.com
          SBOMIFY_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache
          SYFT_CACHE_DIR: ${{ github.workspace }}/.sbomify-cache/syft
